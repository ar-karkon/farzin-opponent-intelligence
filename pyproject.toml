[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farzin-opponent-intelligence"
version = "1.0.0"
description = "Reproducible chess move-prediction research pipeline"
requires-python = ">=3.10"
dependencies = [
  "python-chess==1.999",
  "PyYAML==6.0.3",
]

[tool.setuptools]
packages = ["foi_pipeline"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["kaggle_benchmark/foi_v1_benchmark.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]